services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: microfocus
      MYSQL_USER: microfocus
      MYSQL_PASSWORD: microfocus
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - microfocus-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  microfocus-mysql:
